# Conservative test profile; this is not a cycle-accurate Tandy 1000HX.
[sdl]
fullscreen=false
autolock=false
waitonerror=false

[dosbox]
machine=tandy
memsize=0
memsizekb=640
working directory option=noprompt

[cpu]
core=normal
cputype=8086
cycles=fixed 300
fpu=false

[dos]
xms=false
ems=false
umb=false
lfn=false
automount=false
mountwarning=false

[sblaster]
sbtype=none

[midi]
mpu401=none

[autoexec]
@echo off
mount c out
c:
echo DOSBox-X built-in DOS initially reports:
ver
ver > DEFAULT.TXT
echo.
echo Set the reported version for the DOS 3.3 compatibility test:
ver set 3 30
ver
HXTEST.EXE
